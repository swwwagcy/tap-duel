<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tap Duel Live 讀牌器</title>
<link rel="stylesheet" href="style.css">
<style>
  body { -webkit-user-select: none; user-select: none; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: calc(8px + env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 8px; }
  .bar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 8px; }
  .status { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
  .status .warn { color: var(--wait); font-weight: 700; }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; }
  .stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage video { object-fit: fill; }
  .stage .hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); padding: 16px; text-align: center; }
  #overlay { touch-action: none; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .zoom { display: inline-flex; align-items: center; gap: 6px; }
  .zoom button { min-width: 48px; font-size: 20px; font-weight: 700; }
  .zoom .num { min-width: 52px; text-align: center; font-weight: 700; }
  .readouts { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; align-content: start; }
  #panelRun { flex-wrap: nowrap; }
  .readout { background: var(--surface); border-radius: 10px; padding: 8px; display: flex; gap: 8px; align-items: center; font-size: 14px; }
  .readout .cardface { font-size: 18px; }
  .readout .label { font-weight: 700; }
  .readout .diag { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .readout .why { font-size: 12px; color: var(--wait); }
  .blocker { background: var(--wait); color: #1d1503; border-radius: 10px; padding: 8px 12px; font-weight: 700; }
  .readout.red .label { color: var(--red); } .readout.blue .label { color: var(--blue); }
  p.note { margin: 0; color: var(--muted); font-size: 14px; }
  @media (max-width: 640px) { .bar { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="tabs" id="tableTabs"></div>
    <div class="tabs" id="modeTabs">
      <button type="button" data-mode="run" class="on">運行</button>
      <button type="button" data-mode="zones">調整牌位</button>
    </div>
  </div>
  <div class="status">
    <span class="phase" id="phase" data-phase="idle">未連線</span>
    <span id="statusText" class="muted">按「開始相機」</span>
    <span id="sizeText"></span>
  </div>
  <div class="stage" id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div class="hint" id="hint">手機架在牌桌正上方 30–40 公分，鏡頭朝下，讓所有牌位都在畫面裡。</div>
  </div>

  <!-- Camera controls stay visible in every mode. -->
  <section class="controls" id="cameraBar">
    <button class="primary" id="startCamera" type="button">開始相機</button>
    <button id="fakeCamera" type="button" hidden>使用模擬攝影機</button>
    <span class="zoom" id="zoomBar" hidden>
      <button id="zoomOut" type="button" aria-label="縮小">－</button>
      <span class="num" id="zoomText">1.0×</span>
      <button id="zoomIn" type="button" aria-label="放大">＋</button>
    </span>
    <label id="autoDealLabel" hidden style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="autoDeal" checked style="width:22px;height:22px;min-height:0">自動出牌（模擬）</label>
  </section>

  <section id="panelRun" class="controls" style="flex-direction:column;align-items:stretch">
    <div class="blocker" id="blocker" hidden></div>
    <div class="readouts" id="readouts"></div>
    <p class="note">流程：開始相機 → 到「調整牌位」把框對準桌上的牌位（框比牌大一圈）→ 回到「運行」。不用登記牌組，也不用拍空桌。牌面要朝上、牌角的點數與花色要看得清楚；桌面顏色要和牌有明顯差別。</p>
  </section>

  <section id="panelZones" class="controls" hidden>
    <p class="note" style="flex-basis:100%">用上方的 －／＋ 縮放畫面，讓牌位佔滿畫面。拖曳框框移動位置，拖右下角的方塊調整大小。框要比牌大一圈，四邊都要看得到桌面，牌放歪也還在框內。</p>
    <button id="resetZones" type="button">恢復預設位置</button>
  </section>

</div>
<div id="toast" class="toast" role="status"></div>
<canvas id="work" hidden></canvas>
<script src="games.js"></script>
<script src="engine.js"></script>
<script src="recognizer.js"></script>
<script src="ocr.js"></script>
<script src="demo-camera.js"></script>
<script src="common.js"></script>
<script src="reader.js"></script>
</body>
</html>
