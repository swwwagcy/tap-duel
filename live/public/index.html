<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tap Duel Live</title>
<link rel="stylesheet" href="style.css">
<style>
  .wrap { max-width: 640px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; }
  h1 { margin: 0; font-family: var(--font-num); }
  a.role { display: block; text-decoration: none; color: var(--fg); background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  a.role b { display: block; font-size: 19px; }
  a.role span { color: var(--muted); font-size: 14px; }
  a.role:focus-visible { outline: 3px solid var(--fg); }
  .join { display: flex; gap: 14px; align-items: center; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px 16px; }
  .join .qr { flex: none; width: 132px; background: #fff; border-radius: 8px; padding: 5px; }
  .join .qr svg { display: block; width: 100%; height: auto; }
  .join b { display: block; font-size: 17px; }
  .join span { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
  p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Tap Duel Live</h1>
  <p>真人主持、攝影機讀牌的示範系統。點數只用於示範，不能兌換。</p>
  <a class="role" href="demo.html" id="demoLink" hidden style="border-color:var(--wait)"><b>示範</b><span>觀眾、主控台、讀牌器、主持人畫面並排，模擬攝影機自動出牌，不需要伺服器</span></a>
  <a class="role" href="play.html"><b>觀眾</b><span>在倒數內選擇、看結果與走勢</span></a>
  <div class="join" id="join" hidden><div class="qr" id="joinQr"></div><div><b>讓觀眾掃碼加入</b><span id="joinUrl"></span></div></div>
  <a class="role" href="table.html" style="border-color:var(--go)"><b>現場端</b><span>登入、選遊戲，然後在主控台、主持人畫面、讀牌器之間切換</span></a>
  <a class="role" href="admin.html"><b>登入碼</b><span>替現場端產生一次性的登入 QR code</span></a>
</div>
<script src="vendor/qrcode-generator.js"></script>
<script src="games.js"></script>
<script src="common.js"></script>
<script>
  // A code for the viewer page, to put on a screen so people in the room can join with their phones.
  (function () {
    var address = Live.pageUrl('play.html'), svg = Live.qrSvg(address);
    if (!svg) return;
    document.getElementById('joinQr').innerHTML = svg;
    document.getElementById('joinUrl').textContent = address;
    document.getElementById('join').hidden = false;
  })();
  // On GitHub Pages (or with ?demo) there is no server: everything runs in the browser.
  if (/\.github\.io$/.test(location.hostname) || /[?&]demo\b/.test(location.search) || location.protocol === 'file:') {
    document.getElementById('demoLink').hidden = false;
    document.querySelectorAll('a.role').forEach(function (link) { if (link.id !== 'demoLink') link.href += '?demo'; });
  }
</script>
</body>
</html>
