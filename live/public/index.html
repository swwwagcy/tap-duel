<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tap Duel Live</title>
<link rel="stylesheet" href="style.css">
<style>
  .wrap { max-width: 640px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; }
  h1 { margin: 0; font-family: var(--font-num); }
  a.role { display: block; text-decoration: none; color: var(--fg); background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  a.role b { display: block; font-size: 19px; }
  a.role span { color: var(--muted); font-size: 14px; }
  a.role:focus-visible { outline: 3px solid var(--fg); }
  p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Tap Duel Live</h1>
  <p>真人主持、攝影機讀牌的示範系統。點數只用於示範，不能兌換。</p>
  <a class="role" href="play.html"><b>觀眾</b><span>看牌桌、在倒數內選擇、看結果</span></a>
  <a class="role" href="host.html"><b>主持台</b><span>開始回合、核對讀到的牌、確認結果（需要工作人員密碼）</span></a>
  <a class="role" href="reader.html"><b>讀牌器</b><span>架在牌桌上方的手機，負責讀牌與傳送畫面（需要工作人員密碼）</span></a>
</div>
</body>
</html>
